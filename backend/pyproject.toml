[project]
name = "architect-ai-backend"
version = "0.1.0"
description = "Local-first FastAPI backend for ArchitectAI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "autogen-agentchat>=0.7,<1",
  "autogen-ext[ollama,openai]>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "langgraph>=0.4,<1",
  "chromadb>=0.5,<0.7",
  "python-multipart>=0.0.20,<1",
  "onnxruntime>=1.17,<1.20",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

